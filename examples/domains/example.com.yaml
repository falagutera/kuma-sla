# Example domain config for kuma-sla.
#
# Name each file after the hostname it serves: <hostname>.yaml
# (e.g. sla.example.com.yaml). kuma-sla routes each request to the config
# matching its Host header. Drop as many files as you have domains — there is
# no limit. A request whose Host matches no file falls back to listing every
# active monitor.
#
# Each `include` entry selects Uptime Kuma monitors and accepts:
#   - "Exact monitor name"      exact match on the monitor's name (case-insensitive)
#   - "id:42"                   match by monitor id
#   - "glob:*.example.com"      glob on the name (case-insensitive; * ? [..])
#   - { glob: "*.tools", label: "Tools" }   map form; `label` renames a single match
#
# Files are hot-reloaded (~60s), so edits take effect without a restart.

title: SLA · example.com
subtitle: our public services

# How to label each row:
#   name (default) — the monitor's name in Uptime Kuma
#   host           — the monitor's host/URL (URL host, or hostname[:port])
# A per-entry `label` (map form below) always overrides this.
label_by: host

groups:
  - name: Websites
    include:
      - "www.example.com"
      - "id:12"
      - "glob:*.example.com"

  - name: APIs
    include:
      - { name: "api.example.com", label: "Public API" }

# A flat list (no groups) is also valid — put `include:` at the top level instead.

# Optional custom footer. Each item is text with an optional url. When omitted,
# a small default footer ("powered by kuma-sla") is shown instead.
footer:
  - { text: "Made by Example Org" }
  - { text: "example.com", url: "https://example.com" }
  - { text: "MIT" }
