stages: [test, build, image]

default:
  image: golang:1.27

variables:
  GOFLAGS: -trimpath
  CGO_ENABLED: "0"

vet:
  stage: test
  script:
    - go vet ./...
    - gofmt -l . | tee /dev/stderr | (! read)   # fail if anything is unformatted

build:
  stage: build
  script:
    - GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.build=$CI_PIPELINE_ID" -o kuma-sla-linux-amd64 .
  artifacts:
    paths: [kuma-sla-linux-amd64]
    expire_in: 30 days

# Build the container image and push it to the project's Container Registry.
# Uses kaniko (no Docker daemon needed) and the job token for auth.
# The version is in the VERSION file. Tags: X.Y.Z-BUILD (immutable, pin this one), X.Y.Z and latest.
build-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$IMAGES_REGISTRY_USER" "$IMAGES_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - V="$(cat VERSION)"
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "BUILD=$CI_PIPELINE_ID"
      --destination "registry.gutocarvalho.net/images/kuma-sla:$V-$CI_PIPELINE_ID"
      --destination "registry.gutocarvalho.net/images/kuma-sla:$V"
      --destination "registry.gutocarvalho.net/images/kuma-sla:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
