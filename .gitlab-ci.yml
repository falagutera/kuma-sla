# Shared security stage (gitleaks, govulncheck, trivy gate; the rest advisory), then vet, gofmt,
# go test (no services: the SLA test builds its own SQLite file) and govulncheck.
# On the default branch: the static linux/amd64 binary as a job artifact, and the image published to
# registry.gutocarvalho.net/images/kuma-sla with tags X.Y.Z-BUILD (immutable, pin this one), X.Y.Z and latest.
include:
  - project: 'open/gcn/ci-templates'
    file: '/security.yml'
    ref: main
stages: [security, test, build]

# go.mod needs Go 1.27 and the template's images run an older Go (GOTOOLCHAIN=local; the gosec
# image cannot type-check 1.27 packages): run both scanners on 1.27, same flags as the template.
sec:govulncheck:
  image: golang:1.27-alpine

sec:gosec:
  image: golang:1.27-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - "$(go env GOPATH)/bin/gosec -severity medium -confidence medium ./..."

test:
  stage: test
  image: golang:1.27-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)"
    - go test -p 1 ./...
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - "$(go env GOPATH)/bin/govulncheck ./..."

build:
  stage: build
  image: golang:1.27-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.build=$CI_PIPELINE_ID" -o kuma-sla-linux-amd64 .
  artifacts:
    paths: [kuma-sla-linux-amd64]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$IMAGES_REGISTRY_PASSWORD" | docker login -u "$IMAGES_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - V="$(cat VERSION)"
    - docker build --pull -q --build-arg "BUILD=$CI_PIPELINE_ID" -t "registry.gutocarvalho.net/images/kuma-sla:$V-$CI_PIPELINE_ID" .
    - for t in "$V" latest; do docker tag "registry.gutocarvalho.net/images/kuma-sla:$V-$CI_PIPELINE_ID" "registry.gutocarvalho.net/images/kuma-sla:$t"; done
    - for t in "$V-$CI_PIPELINE_ID" "$V" latest; do docker push -q "registry.gutocarvalho.net/images/kuma-sla:$t"; done
    - echo "published registry.gutocarvalho.net/images/kuma-sla:$V-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
