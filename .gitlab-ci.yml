stages: [test, build, image]

default:
  image: golang:1.27

variables:
  GOFLAGS: -trimpath
  CGO_ENABLED: "0"

vet:
  stage: test
  script:
    - go vet ./...
    - gofmt -l . | tee /dev/stderr | (! read)   # fail if anything is unformatted

build:
  stage: build
  script:
    - GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o kuma-sla-linux-amd64 .
  artifacts:
    paths: [kuma-sla-linux-amd64]
    expire_in: 30 days

# Build the container image and push it to the project's Container Registry.
# Uses kaniko (no Docker daemon needed) and the job token for auth.
image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      ${CI_COMMIT_TAG:+--destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
